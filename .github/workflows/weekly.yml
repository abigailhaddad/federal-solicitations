# One week end to end, every Monday: the previous Monday–Sunday's notices, extracted and checked, added to the
# Hugging Face dataset, the week's post built and deployed, and the email sent. See src/solicitations/weekly.py.
#
# Secrets: ANTHROPIC_API_KEY, ANTHROPIC_WORKSPACE_ID (optional), HF_TOKEN (write), CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (Pages deploy), BUTTONDOWN_API_KEY (the Federal Data Stories list; optional: no email without it).
# Repository variable RFP_EMAIL_SEND=true makes the run send; otherwise it saves a checked draft.
name: Weekly run

on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC (5–6 AM Eastern); the run takes about two to three hours
  workflow_dispatch:
    inputs:
      week:
        description: "Monday the week starts (blank = last full week)"
        required: false
      publish:
        description: "Publish (dataset, site, email)"
        type: boolean
        default: true

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      PYTHONUNBUFFERED: "1"
      # The model reads pypdf's text, as before (the runner had no poppler, so federal_ja fell back to pypdf);
      # pdftotext (poppler) gives the second reading of each PDF page, which every quote on a PDF page must also
      # be in (check.py). Without this setting, installing poppler would switch the text the model reads to
      # pdftotext, and pypdf would become the second reading.
      JA_PDF_ENGINE: pypdf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils && pdftotext -v
      - run: uv sync --frozen
      - run: uv run pytest -q

      - name: Run the week
        run: |
          # PIEE values have not been spot-checked yet (agreed 2026-11-12), so scheduled runs skip PIEE.
          # Remove --skip-piee once a sample of PIEE-sourced values passes the same check as SAM.gov ones.
          ARGS=(--skip-piee)
          if [ -n "${{ inputs.week }}" ]; then ARGS+=(--week "${{ inputs.week }}"); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then ARGS+=(--no-publish); fi
          uv run python -m solicitations.weekly "${ARGS[@]}"

      - name: Keep the run's log and check samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: |
            work/weekly_*.json
            work/post_dry_*.json
            work/*/checks/
            work/*/week.csv
          retention-days: 90

      - name: Build the site
        if: github.event_name == 'schedule' || inputs.publish
        run: uv run python -m solicitations.site --out site/dist

      - name: Deploy the site
        if: github.event_name == 'schedule' || inputs.publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.42.0"
          command: pages deploy site/dist --project-name=rfp-watch --branch=main

      - name: Save the post to the repository
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          # This step runs after the ~2-3 hour pipeline, and the job can also sit behind another
          # run in the `weekly` concurrency group before it starts (actions/checkout fetched main
          # as of when the run was queued, not when it actually started). Either way, origin/main
          # may have moved on by the time we get here, so if the push is rejected, rebase our one
          # commit onto the current tip and retry (rebase, not reset --soft + re-add: this checkout
          # only has this run's own new file on disk, so resetting the index to origin/main's tree
          # would stage a deletion of any file another run already committed that isn't in our
          # working copy).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Weekly post: $(ls data/posts/*.json | sort | tail -1 | xargs basename .json)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt (origin/main moved); fetching and rebasing onto the latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main failed; aborting." >&2
              git rebase --abort || true
              exit 1
            fi
          done
          echo "::error::Failed to push the weekly post after retries." >&2
          exit 1

      - name: Send the email
        if: (github.event_name == 'schedule' || inputs.publish) && env.BUTTONDOWN_API_KEY != ''
        run: |
          post="$(ls data/posts/[0-9]*.json | grep -v replaced | sort | tail -1)"
          if [ "${{ vars.RFP_EMAIL_SEND }}" = "true" ]; then
            uv run python -m solicitations.email "$post" --send
          else
            echo "RFP_EMAIL_SEND is not true: saving a checked draft in Buttondown, sending nothing."
            uv run python -m solicitations.email "$post"
          fi
