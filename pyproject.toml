[project]
name = "federal-solicitations"
version = "0.1.0"
description = "Experimental: what federal solicitations and sources-sought notices on SAM.gov say, each value with its quote"
requires-python = ">=3.12"
dependencies = [
    # SAM.gov client, text extraction, batch model calls and quote checks from the J&A project, at a reviewed commit
    "federal-ja @ git+https://github.com/abigailhaddad/federal-ja-documents@18c7b08",
    "playwright>=1.65.1",
    # Sends one topic of the Federal Data Stories Buttondown list (tag-filtered, draft first, never twice)
    "topic-mail @ git+https://github.com/abigailhaddad/topic-mail@dcd7fd5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solicitations"]

[tool.hatch.metadata]
allow-direct-references = true
